<!doctype html>
<html lang="ru">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RSS Reader</title>
</head>

<body>
  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-12 col-lg-10">
        <div class="card border-0 shadow-sm">
          <div class="card-body p-4 p-lg-5">
            <h1 class="display-6 mb-3">RSS Reader</h1>
            <p class="text-muted mb-4">
              Учебный проект для добавления и просмотра RSS-потоков
            </p>
            <form class="row g-3">
              <div class="col-12 col-md-8">
                <label for="rss-url" class="form-label">Ссылка на RSS</label>
                <input id="rss-url" name="url" type="text" class="form-control"
                  placeholder="https://example.com/feed.xml" autocomplete="off" required aria-describedby="feedback-url" />
                <div id="feedback-url"></div>
              </div>
              <div class="col-12 col-md-4 d-grid align-self-end">
                <button type="submit" class="btn btn-primary">
                  Добавить
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script type="module" src="/src/main.js"></script>
</body>

</html>
